name: SyncSpend APK

# Publishes an installable APK as a GitHub Release so it can be downloaded and
# sideloaded straight from a phone, with no laptop in the loop.
on:
  push:
    branches: ['claude/expense-tracker-quick-log-**']
    paths:
      - 'syncspend/**'
      - '.github/workflows/syncspend-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: syncspend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: syncspend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # The native project is generated, never committed: it is entirely derived
      # from app.json and the installed packages, so checking it in only creates
      # a second source of truth to keep in sync.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: syncspend/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      # An unsigned APK installs on nothing. Expo's template signs release
      # builds with the generated debug keystore, which is what makes the
      # output sideloadable — but if that ever changes, fail here rather than
      # shipping a file that dies at the installer.
      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK=$APK"
          test -n "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          mkdir -p ../dist
          cp "$APK" "../dist/SyncSpend-v${{ github.run_number }}.apk"
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: syncspend-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="syncspend-v1.0.0-build${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk \
            --title "SyncSpend v1.0.0 (build ${{ github.run_number }})" \
            --target "${{ github.sha }}" \
            --notes "Sideloadable Android build of SyncSpend.

          **Install on your phone:** download the \`.apk\` below, open it, and allow installs from your browser when Android asks.

          Signed with the Expo debug keystore, so it installs alongside — not over — any Play Store app. Built from \`${{ github.sha }}\`."
