name: Tracker APK

# Builds the sideloadable APK and attaches it to a GitHub Release, so it can be
# installed straight from a phone. `demo` is the right build type for this: it
# is minified like release but signed with the repo's committed debug keystore,
# so it needs no secrets and installs on any device.
on:
  push:
    branches:
      - 'claude/expense-tracker-quick-log-**'
      - 'claude/money-carryover-income-hide-**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '18'

      - uses: gradle/actions/setup-gradle@v4

      # --stacktrace buries the actual compile error under a few hundred lines
      # of Gradle internals. Keep the full log as an artifact and surface only
      # the lines that say what broke.
      - name: Build demo APK
        run: |
          set -o pipefail
          ./gradlew assembleDemo --no-daemon --console=plain 2>&1 | tee /tmp/gradle.log

      - name: Show what failed
        if: failure()
        run: |
          echo "----- errors -----"
          grep -nE "^e: |Unresolved reference|Execution failed for task|^FAILURE:|^\* What went wrong" \
            /tmp/gradle.log | head -40 || true
          echo "----- tail, minus task list and stack frames -----"
          grep -vE "^> Task |^\s+at |^\s+\.\.\. |^Caused by: org\.gradle" /tmp/gradle.log | tail -45 || true

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log

      - name: Stage the APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/demo -name '*.apk' | head -1)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/Tracker-build${{ github.run_number }}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: tracker-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="tracker-build${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk \
            --title "Tracker (build ${{ github.run_number }})" \
            --target "${{ github.sha }}" \
            --notes "Sideloadable build of Tracker.

          **Install:** download the \`.apk\` below, open it, and allow installs from your browser when Android asks.

          Built from \`${{ github.sha }}\`."
